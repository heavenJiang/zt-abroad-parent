# zt-abroad 生产 / 测试环境：PostgreSQL + Redis + 后端 + Nginx（按域名分流）+ 每日备份
#
#   cd deploy && cp .env.example .env && vi .env      填写域名与密钥
#   ./deploy.sh                                        构建后端镜像与两个前端、执行增量脚本、启动
#
# 与本地开发用的 ../docker-compose.yml 不同：数据库、Redis、后端都不对外暴露端口，只有 Nginx 监听 80 / 443；
# 所有密钥从 .env 注入（开发规范第 8 章：生产凭据不进仓库）；Druid 监控台与接口文档关闭。

name: zt-abroad

services:
  abr-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LANG: C.UTF-8
      TZ: Asia/Shanghai
      ABR_SQL_DIR: /abroad-sql
    volumes:
      - abr-pgdata:/var/lib/postgresql/data
      - ../sql/zt_20261008_postgre.sql:/docker-entrypoint-initdb.d/01_zt.sql:ro
      - ../sql/quartz_postgre.sql:/docker-entrypoint-initdb.d/02_quartz.sql:ro
      - ../sql/abroad/migrate.sh:/docker-entrypoint-initdb.d/03_abroad.sh:ro
      - ../sql/abroad:/abroad-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  abr-redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - abr-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # 内嵌文字识别（MA-15）：只在内网提供给 abr-admin，不映射端口；图片不出服务器
  abr-ocr:
    image: zt-abroad-ocr:${IMAGE_TAG:-latest}
    restart: unless-stopped

  abr-admin:
    image: zt-abroad-admin:${IMAGE_TAG:-latest}
    depends_on:
      abr-postgres:
        condition: service_healthy
      abr-redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:postgresql://abr-postgres:5432/${POSTGRES_DB}?currentSchema=public
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRUID_STATVIEWSERVLET_ENABLED: "false"
      SPRING_DATA_REDIS_HOST: abr-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      TOKEN_SECRET: ${TOKEN_SECRET}
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      ZT_PROFILE: /home/zt/uploadPath
      ABR_APP_URL: https://${APP_DOMAIN}/
      ABR_BRAND_NAME: ${BRAND_NAME:-留学工作室}
      ABR_SITE_DIR: /home/zt/site
      ABR_SITE_URL: https://${WWW_DOMAIN}/
      ABR_SITE_BAIDU_TOKEN: ${SITE_BAIDU_TOKEN:-}
      ABR_SITE_INDEXNOW_KEY: ${SITE_INDEXNOW_KEY:-}
      ABR_WECHAT_OA_APP_ID: ${WECHAT_OA_APP_ID:-}
      ABR_WECHAT_OA_APP_SECRET: ${WECHAT_OA_APP_SECRET:-}
      ABR_WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      ABR_WECHAT_MINI_APP_SECRET: ${WECHAT_MINI_APP_SECRET:-}
      ABR_WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      ABR_WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      ABR_WECOM_SECRET: ${WECOM_SECRET:-}
      ABR_OCR_URL: http://abr-ocr:9003
      ABR_SCORECARD_API_KEY: ${SCORECARD_API_KEY:-DEMO_KEY}
      TZ: Asia/Shanghai
    volumes:
      - abr-upload:/home/zt
      # 公开项目页（M7-08）：后端生成，Nginx 只读提供
      - ./site/www:/home/zt/site
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  abr-nginx:
    image: nginx:1.27-alpine
    depends_on:
      - abr-admin
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      WWW_DOMAIN: ${WWW_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      TZ: Asia/Shanghai
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./site/admin:/usr/share/nginx/admin:ro
      - ./site/app:/usr/share/nginx/app:ro
      - ./site/www:/usr/share/nginx/www:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

  abr-backup:
    image: postgres:15
    depends_on:
      abr-postgres:
        condition: service_healthy
    environment:
      PGHOST: abr-postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      TZ: Asia/Shanghai
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/usr/local/bin/backup.sh", "schedule"]
    restart: unless-stopped

volumes:
  abr-pgdata:
  abr-redisdata:
  abr-upload:
