# 项目相关配置
zt:
  # 名称
  name: zt
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/zt/uploadPath，Linux配置 /home/zt/uploadPath）
  profile: D:/zt/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口（本项目用 8090，与 zt-vision-parent 的 8080 错开）
  port: 8090
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ygb: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（数据开放上游账单导入允许 20MB；其他上传接口由 FileUploadUtils 自行限制）
      max-file-size: 20MB
      # 设置总上传的文件大小
      max-request-size: 25MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口（本项目用 6380，与 zt-vision-parent 的 6379 错开）
      port: 6380
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ygb.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ygb.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/abroad/questionnaire/**,/abroad/engine/**,/app/assessment/**,/app/tool/**
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/abroad/*,/app/*

# 留学 AI 网关（M2-04）：模型供应商与单价；Agent 中的模型写作 供应商名:模型名（如 deepseek:deepseek-chat）
# api-key 只从环境变量注入，不写入仓库；单价单位为 元 / 1000 token，上线前按供应商官网核对
# 模型名含点号时用方括号写键，如 "[qwen2.5-72b-instruct]"
abroad:
  app:
    # 落地页显示“已有 N 人完成测评”的人数下限：少于此数不显示（只显示真实人数）
    landing-count-min: 100
    # C 端地址（分享海报二维码指向这里，带 ch=share&ct=分享码）；生产由环境变量 ABR_APP_URL 注入
    url: ${ABR_APP_URL:http://localhost:5173/}
    # 品牌名（分享海报顶部）
    brand-name: ${ABR_BRAND_NAME:留学工作室}
  card:
    # 图卡字体族（为空时自动选第一个能显示中文的字体；Docker 镜像已安装文泉驿微米黑）
    font-family: ""
  ai:
    filter:
      # 单个字符串字段最大长度，超过视为整篇文书并拦截
      max-field-length: 1500
    # AI 预填（M2-06）抓取官网页面：只允许 http/https 公网地址，最多 3 次重定向，连接 10 秒 / 总计 15 秒，正文最多 2 MB
    fetch:
      # 是否允许抓取本机、内网地址。生产必须为 false（防 SSRF）；只有测试实例为了用本机 HTTP 服务提供样例页面才设为 true
      allow-private-hosts: false
      # 页面转纯文本后交给模型的最大字符数（超过截断）
      max-chars: 30000
    providers:
      # 离线 mock：返回 prompts/<agent>/<版本>/mock.json，供开发、单元测试与评测
      mock:
        type: mock
        models:
          default:
            input-price-per-1k: 0.001
            output-price-per-1k: 0.002
      deepseek:
        type: openai-compatible
        base-url: https://api.deepseek.com/v1
        api-key: ${ABR_AI_DEEPSEEK_API_KEY:}
        models:
          deepseek-chat:
            input-price-per-1k: 0.002
            output-price-per-1k: 0.008
      qwen:
        type: openai-compatible
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${ABR_AI_QWEN_API_KEY:}
        models:
          qwen-plus:
            input-price-per-1k: 0.0008
            output-price-per-1k: 0.002
