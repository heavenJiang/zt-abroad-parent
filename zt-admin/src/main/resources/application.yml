# 项目相关配置
zt:
  # 名称
  name: zt
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/zt/uploadPath，Linux配置 /home/zt/uploadPath）
  profile: D:/zt/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口（本项目用 8090，与 zt-vision-parent 的 8080 错开）
  port: 8090
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ygb: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小（数据开放上游账单导入允许 20MB；其他上传接口由 FileUploadUtils 自行限制）
      max-file-size: 20MB
      # 设置总上传的文件大小
      max-request-size: 25MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口（本项目用 6380，与 zt-vision-parent 的 6379 错开）
      port: 6380
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ygb.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: postgresql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ygb.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/abroad/questionnaire/**,/abroad/engine/**,/abroad/orchestrator/**,/abroad/content/**,/abroad/compliance/**,/abroad/evalCase/**,/app/assessment/**,/app/tool/**
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/abroad/*,/app/*

# 留学 AI 网关（M2-04）：模型供应商与单价；Agent 中的模型写作 供应商名:模型名（如 deepseek:deepseek-chat）
# api-key 只从环境变量注入，不写入仓库；单价单位为 元 / 1000 token，上线前按供应商官网核对
# 模型名含点号时用方括号写键，如 "[qwen2.5-72b-instruct]"
abroad:
  app:
    # 落地页显示“已有 N 人完成测评”的人数下限：少于此数不显示（只显示真实人数）
    landing-count-min: 100
    # C 端地址（分享海报二维码指向这里，带 ch=share&ct=分享码）；生产由环境变量 ABR_APP_URL 注入
    url: ${ABR_APP_URL:http://localhost:5173/}
    # 品牌名（分享海报顶部）
    brand-name: ${ABR_BRAND_NAME:留学工作室}
  moment:
    # 转化时刻推荐：两次推荐展示的最小间隔（小时）；每类时刻每人只推荐一次，规则在管理端「转化时刻」配置
    min-interval-hours: 24
  content:
    # AI 生成标识：AI 生成的内容通过合规闸门前须在正文中带上这段文字
    ai-label: 本文由 AI 辅助生成
  compliance:
    # 合规闸门（M6-03）：AI 生成的消息（自动回复、培育消息）须带的标识；词表在管理端「合规词表」配置
    message-ai-label: （AI 回复）
  growth:
    # 营销编排器（定时任务 abrOrchestratorTask.dispatch() 每分钟一轮）：每轮最多执行的任务数
    batch-size: 10
    # 执行中超过多少分钟视为中断（恢复为待执行，达到最多次数为失败）
    stale-minutes: 15
    # 定时规则停机后补触发的窗口（分钟）：更早错过的时刻不补
    schedule-catch-up-minutes: 10
    # 事件读取：每批条数、每轮最多批数、写入后多少秒视为已静置（游标可越过之前的 ID 空洞）
    event-batch: 500
    event-batches-per-round: 5
    event-settle-seconds: 120
    # 管理端手动重试后的任务有效期（小时）
    retry-ttl-hours: 24
  resume:
    # 简历 / 成绩单原件目录：必须是私有目录，不能放在 zt.profile 下（/profile/** 对外公开）；
    # 为空时用 zt.profile 的同级目录 private/resume（Docker 中为 /home/zt/private/resume，在数据卷内）
    dir: ${ABR_RESUME_DIR:}
    # 单份大小上限（MB，同时受问卷 resume_upload.file.max_size_mb 限制）
    max-size-mb: 10
    # 每份测评累计最多上传次数（含重新上传）
    max-uploads: 6
    # 原件保存天数，到期由定时任务 abrResumeTask.purgeExpired() 删除（隐私政策：识别后 30 日）
    retention-days: 30
    # PDF 最多读取页数；去除敏感行后交给模型的最大字符数
    max-pages: 10
    max-chars: 12000
  site:
    # 公开项目页（M7-08，定时任务 abrSiteTask.refresh() 每 5 分钟检查院校库与日期，有变化时只重写变化的页面）
    # 生成目录（Nginx www 域名的根目录）；为空时用 zt.profile 的同级目录 site（Docker 中为 /home/zt/site）
    dir: ${ABR_SITE_DIR:}
    # 站点地址（规范链接、站点地图、收录提交用，以 / 结尾）；生产由 ABR_SITE_URL 注入
    url: ${ABR_SITE_URL:http://localhost/}
    # 页面上“测一下”“关注”入口的渠道码（ct 为 p + 项目ID）
    channel: site
    # C 端“关注这个项目”页面（带 programId；页面随 M8-05 项目动态订阅实现）
    follow-page: pages/follow/index
    submit:
      # 百度普通收录 API 推送令牌（搜索资源平台获取）；为空不提交
      baidu-token: ${ABR_SITE_BAIDU_TOKEN:}
      # IndexNow 密钥（必应等，8–128 位字母、数字、短横线；生成器会写入站点根目录 {key}.txt）；为空不提交
      indexnow-key: ${ABR_SITE_INDEXNOW_KEY:}
      # 单次最多提交的地址数
      max-urls: 500
  card:
    # 图卡字体族（为空时自动选第一个能显示中文的字体；Docker 镜像已安装文泉驿微米黑）
    font-family: ""
  ai:
    filter:
      # 单个字符串字段最大长度，超过视为整篇文书并拦截
      max-field-length: 1500
    # AI 预填（M2-06）抓取官网页面：只允许 http/https 公网地址，最多 3 次重定向，连接 10 秒 / 总计 15 秒，正文最多 2 MB
    fetch:
      # 是否允许抓取本机、内网地址。生产必须为 false（防 SSRF）；只有测试实例为了用本机 HTTP 服务提供样例页面才设为 true
      allow-private-hosts: false
      # 页面转纯文本后交给模型的最大字符数（超过截断）
      max-chars: 30000
    providers:
      # 离线 mock：返回 prompts/<agent>/<版本>/mock.json，供开发、单元测试与评测
      mock:
        type: mock
        models:
          default:
            input-price-per-1k: 0.001
            output-price-per-1k: 0.002
      deepseek:
        type: openai-compatible
        base-url: https://api.deepseek.com/v1
        api-key: ${ABR_AI_DEEPSEEK_API_KEY:}
        models:
          deepseek-chat:
            input-price-per-1k: 0.002
            output-price-per-1k: 0.008
      qwen:
        type: openai-compatible
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${ABR_AI_QWEN_API_KEY:}
        models:
          qwen-plus:
            input-price-per-1k: 0.0008
            output-price-per-1k: 0.002
